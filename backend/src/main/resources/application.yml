server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/smart_campus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
    username: campus
    password: campus123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-init-sql: SET NAMES utf8mb4
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    write-dates-as-timestamps: false
  redis:
    host: redis
    port: 6379
    timeout: 3000

app:
  jwt:
    secret: SmartCampusReservationSystem2024SecretKeyForJWT
    expiration-ms: 86400000

  reservation:
    no-show-timeout-minutes: 30
    max-duration-hours: 4
    credit:
      initial-score: 100
      deduct-on-no-show: 10
      reward-on-use: 2
